name: SUTRA web verification

on:
  pull_request:
  push:
    branches: [main, 'codex/sutra-t01-integration-20261012']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sutra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sutra
        with:
          smarana-read-token: ${{ secrets.SMARANA_READ_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: npm run test:contracts
      - run: npm run test:media
      - name: Salad secure setup and redacted input diagnostics (synthetic inputs only)
        run: |
          python3 -m unittest discover -s qa/t04-salad-access-20261015 -p test_secure_setup.py -v
          python3 -m unittest discover -s qa/t04-salad-auth-20261015 -p test_input_diagnostic.py -v
      - run: node qa/t08/run.mjs redteam
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sutra-contract-results
          path: |
            test-results/ci
            test-results/t08
            qa/t05-real-export-20261014/exports
            qa/t05-real-export-20261014/measurements.json
            qa/t05-final-media-20261015/exports
            qa/t05-final-media-20261015/media-ci.json
          if-no-files-found: warn

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sutra
        with:
          smarana-read-token: ${{ secrets.SMARANA_READ_TOKEN }}
      - run: npm run check
      - run: npx playwright install --with-deps chromium webkit
      - name: Native browser error guard method boundaries
        run: node --test qa/t01-final-20261015/browser-harness/guard.test.mjs qa/t01-final-20261015/browser-harness/social-read-barrier-20261015/barrier.test.mjs
      - run: node qa/t08/run.mjs browser-redteam
      - name: Library pagination and consent contrast regressions
        run: node qa/t07-frontend-fixes-20261014/browser.mjs --production
      - name: Integrated desktop/mobile Chromium and WebKit journeys (synthetic identity, one build)
        run: node qa/t07-final-ux-perf-20261015/run.mjs --final-integrated
      - run: node scripts/run-ci.mjs legacy
      - run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - run: python3 -m unittest discover -s qa/t01-consolidation-20261014 -p 'test_*.py'
      - name: Atomic social history transition and retained rollback simulations
        run: python3 qa/t01-final-20261015/social-history-transition-test.py
      - name: Exact candidate promotion and rollback simulations
        run: |
          python3 - <<'PY'
          import sys, unittest
          from pathlib import Path
          sys.path.insert(0, 'deploy')
          import test_salad_promotion as tests
          tests.SOURCE = Path('qa/t01-consolidation-20261014').resolve()
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromModule(tests))
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Audit production dependencies
        if: always()
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sutra-quality-results
          path: |
            test-results/ci
            test-results/ui-isolated
            test-results/legacy
            test-results/t08
            qa/t07-frontend-fixes-20261014/evidence/after
            qa/t01-final-20261015/browser-final
            qa/t01-final-20261015/browser-harness/method-boundary-20261015
          if-no-files-found: warn

  disposable-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: sutra_ci_actions
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d sutra_ci_actions"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sutra
        with:
          smarana-read-token: ${{ secrets.SMARANA_READ_TOKEN }}
      - run: npm run test:migration-local
        env:
          SUTRA_DISPOSABLE_DB: '1'
          DATABASE_URL_LOCAL: postgres://fixture:fixture@127.0.0.1:5432/sutra_ci_actions
      - name: Pipeline concurrency on disposable PostgreSQL
        run: node --import tsx --test scripts/test-pipeline-postgres.mts
        env:
          SUTRA_DISPOSABLE_DB: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: fixture
          PGPASSWORD: fixture
      - name: Account and integrated migration permissions on a private cluster
        run: SUTRA_TEST_PG_BIN="$(pg_config --bindir)" node scripts/test-security-rls.mjs
      - name: Client write permissions and atomic social history
        run: |
          SUTRA_TEST_PG_BIN="$(pg_config --bindir)" node scripts/test-final-write-permissions.mjs
          SUTRA_TEST_PG_BIN="$(pg_config --bindir)" node scripts/test-final-social-history.mjs
      - name: Social revocation routes with canonical timestamp and history triggers
        run: SUTRA_TEST_PG_BIN="$(pg_config --bindir)" node qa/t06-integrated-retest-20261015/run-postgres.mjs history
      - name: Schedule compare-and-swap through the actual route and query builder
        run: SUTRA_TEST_PG_BIN="$(pg_config --bindir)" node qa/t01-closure-20261015/schedule-postgres-run.mjs
      - name: Atomic partner quota, historical compatibility, backup and rollback
        run: SUTRA_TEST_PG_BIN="$(pg_config --bindir)" node qa/t01-certification-20261019/partner-pg-run.mjs partner-pg-ci
      - name: Durable HTTP route acknowledgement loss against disposable PostgreSQL
        run: node --experimental-test-module-mocks --import tsx --test --test-concurrency=1 qa/t03-final-candidate-20261015/api-postgres.test.mts
        env:
          SUTRA_DISPOSABLE_DB: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: fixture
          PGPASSWORD: fixture
          NODE_OPTIONS: --require=./qa/t08/offline.cjs
          NEXT_PUBLIC_SUPABASE_URL: https://db.fixture.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture-anon
          SUPABASE_SERVICE_ROLE_KEY: fixture-service
      - name: Salad isolated journal, concurrency and immutable artifacts
        run: node --import tsx --test scripts/test-salad-persistence.mts
        env:
          SUTRA_DISPOSABLE_DB: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: fixture
          PGPASSWORD: fixture
      - name: Lost completion acknowledgement and OAuth revocation races
        run: node --import tsx --test --test-concurrency=1 qa/t03-orchestration-fixes-20261014/finish-postgres.test.mts qa/t03-durable-reliability-20261014/postgres.test.mts qa/t06-social-recovery-20261014/test-postgres.mts qa/t01-final-20261015/durable-postgres.test.mts
        env:
          SUTRA_DISPOSABLE_DB: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: fixture
          PGPASSWORD: fixture
          NODE_OPTIONS: --require=./qa/t08/offline.cjs
          NEXT_PUBLIC_SUPABASE_URL: https://sutra-test.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture-anon
          SUPABASE_SERVICE_ROLE_KEY: fixture-service
