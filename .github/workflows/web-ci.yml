name: SUTRA web verification

on:
  pull_request:
  push:
    branches: [main, 'codex/sutra-t01-integration-20261012']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sutra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sutra
        with:
          smarana-read-token: ${{ secrets.SMARANA_READ_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: npm run test:contracts
      - run: npm run test:media
      - run: node qa/t08/run.mjs redteam
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sutra-contract-results
          path: |
            test-results/ci
            test-results/t08
            qa/t05-real-export-20261014/exports
            qa/t05-real-export-20261014/measurements.json
          if-no-files-found: warn

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sutra
        with:
          smarana-read-token: ${{ secrets.SMARANA_READ_TOKEN }}
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: node qa/t08/run.mjs browser-redteam
      - name: Library pagination and consent contrast regressions
        run: node qa/t07-frontend-fixes-20261014/browser.mjs --production
      - name: Integrated legal consent and desktop/mobile journeys (synthetic identity)
        run: |
          node qa/t07-frontend-journey-20261014/run.mjs
          node qa/t07-frontend-journey-20261014/run.mjs --journeys
          node qa/t07-frontend-journey-20261014/run.mjs --journeys --private-download
      - run: node scripts/run-ci.mjs legacy
      - run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - run: python3 -m unittest discover -s qa/t01-consolidation-20261014 -p 'test_*.py'
      - name: Exact candidate promotion and rollback simulations
        run: |
          python3 - <<'PY'
          import sys, unittest
          from pathlib import Path
          sys.path.insert(0, 'deploy')
          import test_salad_promotion as tests
          tests.SOURCE = Path('qa/t01-consolidation-20261014').resolve()
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromModule(tests))
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Audit production dependencies
        if: always()
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sutra-quality-results
          path: |
            test-results/ci
            test-results/ui-isolated
            test-results/legacy
            test-results/t08
            qa/t07-frontend-fixes-20261014/evidence/after
            qa/t07-frontend-journey-20261014/after
            qa/t07-frontend-journey-20261014/journey-after
            qa/t07-frontend-journey-20261014/private-download-after
          if-no-files-found: warn

  disposable-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: sutra_ci_actions
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d sutra_ci_actions"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sutra
        with:
          smarana-read-token: ${{ secrets.SMARANA_READ_TOKEN }}
      - run: npm run test:migration-local
        env:
          SUTRA_DISPOSABLE_DB: '1'
          DATABASE_URL_LOCAL: postgres://fixture:fixture@127.0.0.1:5432/sutra_ci_actions
      - name: Pipeline concurrency on disposable PostgreSQL
        run: node --import tsx --test scripts/test-pipeline-postgres.mts
        env:
          SUTRA_DISPOSABLE_DB: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: fixture
          PGPASSWORD: fixture
      - name: Account and integrated migration permissions on a private cluster
        run: SUTRA_TEST_PG_BIN="$(pg_config --bindir)" node scripts/test-security-rls.mjs
      - name: Salad isolated journal, concurrency and immutable artifacts
        run: node --import tsx --test scripts/test-salad-persistence.mts
        env:
          SUTRA_DISPOSABLE_DB: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: fixture
          PGPASSWORD: fixture
      - name: Lost completion acknowledgement and OAuth revocation races
        run: node --import tsx --test --test-concurrency=1 qa/t03-orchestration-fixes-20261014/finish-postgres.test.mts qa/t03-durable-reliability-20261014/postgres.test.mts qa/t06-social-recovery-20261014/test-postgres.mts
        env:
          SUTRA_DISPOSABLE_DB: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: fixture
          PGPASSWORD: fixture
          NODE_OPTIONS: --require=./qa/t08/offline.cjs
          NEXT_PUBLIC_SUPABASE_URL: https://sutra-test.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture-anon
          SUPABASE_SERVICE_ROLE_KEY: fixture-service
